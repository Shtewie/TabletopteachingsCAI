<!doctype html>

  <title>Page not found | Tabletop Teachings</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <style>
    :root{--background:oklch(0.968 0.018 85);--foreground:oklch(0.245 0.032 60);--primary:oklch(0.72 0.16 68);--primary-foreground:oklch(0.99 0.006 90);--muted:oklch(0.955 0.014 90);--card:oklch(0.985 0.012 88);--radius-xl:2.5rem;--shadow-parchment:0 10px 30px -16px color-mix(in oklab,oklch(0.4 0.06 60) 45%,transparent);--font-display:"Fredoka",system-ui,sans-serif;--font-body:"Quicksand",system-ui,sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background-color:var(--background);color:var(--foreground);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:var(--font-display);letter-spacing:.01em;margin:0}
    p{margin:0}a{color:inherit;text-decoration:none}
    .min-h-screen{min-height:100vh}
    .eyebrow{display:inline-block;margin-bottom:1.25rem;border-radius:9999px;background:var(--primary);color:var(--primary-foreground);padding:.25rem 1rem;font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .contact-card{position:relative;overflow:hidden;max-width:36rem;margin-inline:auto;border-radius:var(--radius-xl);border:4px solid var(--muted);background:var(--card);padding:2.5rem 1.5rem;text-align:center;box-shadow:var(--shadow-parchment)}
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" as="style" href="/css/style.css" onload="this.onload=null;this.rel='stylesheet'" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
  </noscript>
</head>
