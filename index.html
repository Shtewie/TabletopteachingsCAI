<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Adventures | Tabletop Teachings</title>
  <meta name="author" content="Tabletop Teachings" />
  <meta name="description" content="Follow the three D&D campaigns Tabletop Teachings is running right now — the worlds, the characters and the reading, writing and social goals each party has completed." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Live Adventures | Tabletop Teachings" />
  <meta property="og:description" content="An interactive log of our current campaigns: world events, player characters and learning objectives completed." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../favicon.ico" type="image/x-icon" />

  <!-- Critical, above-the-fold CSS inlined so the page paints without
       waiting on any network request (fixes render-blocking + chained
       critical requests). The full stylesheet below fills in everything
       else once it arrives; values here are kept in sync with css/style.css. -->
  <style>
    :root{--background:oklch(0.968 0.018 85);--foreground:oklch(0.245 0.032 60);--secondary:oklch(0.955 0.024 88);--secondary-foreground:oklch(0.36 0.05 62);--primary:oklch(0.72 0.16 68);--primary-foreground:oklch(0.99 0.006 90);--accent:oklch(0.63 0.19 18);--accent-foreground:oklch(0.99 0.006 90);--muted:oklch(0.955 0.014 90);--radius-2xl:3rem;--font-display:"Fredoka",system-ui,sans-serif;--font-body:"Quicksand",system-ui,sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background-color:var(--background);color:var(--foreground);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:var(--font-display);letter-spacing:.01em;margin:0}
    p{margin:0}a{color:inherit;text-decoration:none}
    .container{width:100%;max-width:64rem;margin-inline:auto;padding:3rem 1.5rem}
    .site-nav .container{padding-block:0}
    .min-h-screen{min-height:100vh}
    .eyebrow{display:inline-block;margin-bottom:1.25rem;border-radius:9999px;background:var(--primary);color:var(--primary-foreground);padding:.25rem 1rem;font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .site-nav{position:sticky;top:0;z-index:50;border-bottom:4px dotted color-mix(in oklab,var(--primary) 30%,transparent);background:color-mix(in oklab,var(--background) 90%,transparent);backdrop-filter:blur(6px)}
    .site-nav .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;padding-block:1rem}
    .brand{display:flex;align-items:center;gap:.5rem}
    .brand-mark{display:flex;align-items:center;justify-content:center;width:2.25rem;height:2.25rem;border-radius:.75rem;background:var(--primary)}
    .brand-mark span{width:1rem;height:1rem;transform:rotate(45deg);border-radius:3px;border:2px solid var(--primary-foreground)}
    .brand-name{font-family:var(--font-display);font-size:1.25rem;color:var(--primary)}
    .nav-links{display:flex;align-items:center;gap:.25rem;font-size:.875rem;font-weight:700;color:var(--secondary-foreground)}
    .nav-links a{border-radius:9999px;padding:.375rem .75rem;transition:background-color .15s ease}
    .nav-links a:hover,.nav-links a[aria-current="page"]{background:var(--muted)}
    .nav-cta{border-radius:9999px;background:var(--accent);color:var(--accent-foreground)!important;padding:.375rem 1rem}
    .quest-board-header{margin-bottom:2.5rem;border-radius:var(--radius-2xl);border:4px dashed color-mix(in oklab,var(--primary) 40%,transparent);background:var(--secondary);padding:2.5rem 1.5rem;text-align:center}
    .quest-board-header h1{margin-bottom:1rem;font-size:2.25rem;color:var(--primary)}
    .quest-board-header p{margin-inline:auto;max-width:42rem;font-size:1.125rem;line-height:1.6;color:var(--secondary-foreground)}
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts and the full stylesheet are loaded async (preload -> swap to
       stylesheet on load) so they never block first paint. This also takes
       both requests out of the critical/render-blocking chain that
       PageSpeed was flagging. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" as="style" href="../css/style.css" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../css/style.css" />
  </noscript>
</head>
<body>
  <div class="min-h-screen">
    <nav class="site-nav">
      <div class="container" style="padding-block: 1rem;">
        <a href="../#top" class="brand">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span class="brand-name">Tabletop Teachings</span>
        </a>
        <div class="nav-links">
          <a href="../#tenets">Our Quests</a>
          <a href="./" aria-current="page">Adventures</a>
          <a href="../#join">How To Join</a>
          <a href="../#contact" class="nav-cta">Say Hello</a>
        </div>
      </div>
    </nav>

    <div class="container">
      <header class="quest-board-header">
        <span class="eyebrow">Quest Board</span>
        <h1>Live Adventures</h1>
        <p>Three parties are adventuring right now. Pick a campaign to see how their world is changing, who is at the table, and which skills they've levelled up.</p>
      </header>

      <main>
        <div id="campaign-switcher" class="campaign-switcher"></div>
        <section id="campaign-panel" class="campaign-panel"></section>
      </main>

      <footer class="site-footer">
        © <span id="year"></span> Tabletop Teachings
      </footer>
    </div>
  </div>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="../js/adventures-data.js"></script>
  <script src="../js/adventures.js"></script>
</body>
</html>
