[build]
  publish = "."

# Short cache windows since files aren't fingerprinted — if you edit
# style.css or adventures.js, visitors will see the change within an hour
# rather than needing a cache-busting rename.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/adventures"
  to = "/adventures/"
  status = 301
  force = true
